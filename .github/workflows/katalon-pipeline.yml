name: Run Katalon Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  katalon_execution:
    # 1. Changed runner from windows-latest to macos-latest
    runs-on: macos-latest 
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Katalon Studio GitHub Action
      uses: katalon-studio/katalon-studio-github-action@v5.0
      with:
        version: '10.4.3' # Replace with your target Katalon Runtime Engine version
        projectPath: '${{ github.workspace }}'
        # 2. Changed browserType argument to Safari (or use "Chrome" if preferred)
        args: '-noSplash -retry=0 -testSuitePath="Test Suites/Web/webSmoke/batch5_TS" -browserType="Chrome (headless)" -apiKey=${{ secrets.KATALON_API_KEY }} --config -webui.autoUpdateDrivers=true'
